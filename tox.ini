[tox]
skipsdist=True
skip_missing_interpreters = True
envlist = fmt, lint, unit

[vars]
src_path = "{toxinidir}/src"
tests_path = "{toxinidir}/tests"
all_path = {[vars]src_path} {[vars]tests_path}

[testenv]
setenv =
  PYTHONPATH = {toxinidir}:{toxinidir}/lib:{toxinidir}/src
  PYTHONBREAKPOINT=pdb.set_trace
  PY_COLORS=1
passenv =
  PYTHONPATH
  CHARM_BUILD_DIR
  MODEL_SETTINGS
allowlist_externals =
  poetry

[testenv:fmt]
description = Apply coding style standards to code
deps =
    ruff
commands =
    ruff format {[vars]all_path}

[testenv:lint]
description = Check code against coding style standards
deps =
    ruff
    codespell
commands =
    # uncomment the following line if this charm owns a lib
    # codespell {[vars]lib_path}
    codespell "{toxinidir}" \
              --skip "{toxinidir}/.git" \
              --skip "{toxinidir}/.tox" \
              --skip "{toxinidir}/build" \
              --skip "{toxinidir}/lib" \
              --skip "{toxinidir}/venv" \
              --skip "{toxinidir}/.mypy_cache" \
              --skip "{toxinidir}/icon.svg"
    
    ruff check {[vars]all_path}

[testenv:unit]
description = Run unit tests and generate coverage report
commands_pre =
    poetry install --only main,charm-libs,unit
commands =
    poetry run coverage run --source={[vars]src_path} \
        -m pytest -v --tb native -s {posargs:{[vars]tests_path}/unit}
    poetry run coverage report
    poetry run coverage xml

