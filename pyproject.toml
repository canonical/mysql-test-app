[dependency-groups]
main = [
    "ops~=2.0",
    "tenacity~=8.1",
    "mysql-connector-python~=9.4",
]
charm-libs = [
    # data_platform_libs/v0/data_interfaces.py
    "ops~=2.0",
]

[tool.poetry]
package-mode = false
requires-poetry = ">=2.2.0"

[tool.poetry.dependencies]
python = ">=3.10"

# Testing tools configuration
[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true

[tool.pytest.ini_options]
minversion = "6.0"
log_cli_level = "INFO"

# Formatting tools configuration
[tool.black]
line-length = 99
target-version = ["py310"]

# Linting tools configuration
[tool.ruff]
line-length = 99
extend-exclude = ["__pycache__", "*.egg_info"]

[tool.ruff.lint]
select = ["E", "W", "F", "C", "N", "D", "I001"]
ignore = ["E501", "D107"]
extend-ignore = [
    "D203",
    "D204",
    "D213",
    "D215",
    "D400",
    "D404",
    "D406",
    "D407",
    "D408",
    "D409",
    "D413",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "D100",
    "D101",
    "D102",
    "D103",
    "D104"
]

[tool.ruff.lint.mccabe]
max-complexity = 10
