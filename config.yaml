options:
  auto_start_writes:
    description: "Whether to auto start continuous writes on relation events."
    type: boolean
    default: true
  database_name:
    description: "Name of database to direct continuous writes to"
    type: string
    default: "continuous_writes"
  sleep_interval:
    description: "How many milliseconds to sleep between writes"
    default: 0
    type: int
  read_interval:
    description: |
        How many milliseconds to sleep between continuous reads rounds
        Use `juju ssh <unit> tail -f /tmp/continuous_reads.pipe` to see reads
    default: 1000
    type: int
